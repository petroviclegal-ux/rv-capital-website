  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="url(#fade)" stroke-width="1.5" fill="none">
    <line x1="-50" y1="640" x2="1250" y2="470"/>
    <line x1="-50" y1="600" x2="1250" y2="410"/>
    <line x1="-50" y1="560" x2="1250" y2="350"/>
    <line x1="-50" y1="520" x2="1250" y2="290"/>
    <line x1="-50" y1="480" x2="1250" y2="230"/>
