  <g transform="translate(90 92) scale(1.08)" fill="#B08D57">
    <rect x="22" y="0" width="30" height="8"/><rect x="66" y="0" width="30" height="8"/>
    <rect x="22" y="8" width="8" height="34"/><rect x="44" y="8" width="8" height="12"/><rect x="66" y="8" width="8" height="34"/><rect x="88" y="8" width="8" height="22"/>
    <rect x="0" y="22" width="20" height="8"/><rect x="32" y="22" width="32" height="8"/><rect x="76" y="22" width="12" height="8"/>
    <rect x="0" y="30" width="8" height="22"/><rect x="44" y="32" width="8" height="32"/>
    <rect x="8" y="44" width="34" height="8"/><rect x="54" y="44" width="42" height="8"/><rect x="88" y="52" width="8" height="22"/>
    <rect x="22" y="54" width="8" height="42"/><rect x="66" y="54" width="8" height="42"/>
    <rect x="0" y="66" width="20" height="8"/><rect x="32" y="66" width="32" height="8"/><rect x="76" y="66" width="12" height="8"/>
    <rect x="0" y="74" width="8" height="22"/><rect x="44" y="76" width="8" height="20"/>
    <rect x="8" y="88" width="14" height="8"/><rect x="52" y="88" width="14" height="8"/>
  </g>

  <text x="230" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#F7F5F0" letter-spacing="1">RV Capital</text>
  <text x="232" y="188" font-family="Arial, sans-serif" font-size="20" fill="#B08D57" letter-spacing="6">M&#38;A &#183; CORPORATE FINANCE</text>

  <text x="96" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#F7F5F0">
    <tspan x="96" dy="0">Independent M&#38;A and corporate</tspan>
    <tspan x="96" dy="76">finance advisory in Dubai.</tspan>
  </text>

  <text x="96" y="556" font-family="Arial, sans-serif" font-size="26" fill="#F7F5F0" fill-opacity="0.65">Advising companies and shareholders across the UAE, the GCC and internationally.</text>
